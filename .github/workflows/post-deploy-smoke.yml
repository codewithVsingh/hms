name: Post-deploy smoke
# Run manually after a deployment. Read-only; needs no secrets.
on:
  workflow_dispatch:
    inputs:
      website_url:
        description: Website base URL (e.g. https://staging.example.org)
        required: true
      portal_url:
        description: Portal base URL (e.g. https://portal-staging.example.org)
        required: true
      demo:
        description: Skip checks that need a live database (demo deployments)
        type: boolean
        default: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/smoke-deployed.mjs --website "${{ inputs.website_url }}" --portal "${{ inputs.portal_url }}" ${{ inputs.demo && '--demo' || '' }}
